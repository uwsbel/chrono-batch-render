[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "render-bench"
version = "0.1.0"
description = "Benchmark harness comparing Chrono Batch Render with other renderers"
license = "BSD-3-Clause"
authors = [{ name = "Alex Maietta" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "trimesh>=4", "pyarrow>=15", "nvidia-ml-py>=12", "tomli>=2; python_version < '3.11'"]

[project.optional-dependencies]
chrono = ["chrono-batch-render"]
media = ["pillow>=10.1", "imageio-ffmpeg>=0.5"]
quality = ["flip-evaluator", "lpips"]
test = ["pytest>=8", "pillow>=10.1", "imageio-ffmpeg>=0.5"]

[project.scripts]
render-bench = "render_bench.cli:main"

[tool.setuptools.packages.find]
include = ["render_bench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["scans_processes: lets the harness scan other processes", "needs_perf: needs perf_event_open access"]
